name: GPXroad
options:
  bundleIdPrefix: com.gpxroad
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  # It31 : français = langue de développement (les clés de traduction SONT les textes français) ;
  # traductions en/de/es/it dans GPXroad/Resources/<langue>.lproj.
  developmentLanguage: fr
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
# MapLibre est la SEULE dépendance tierce autorisée du projet (cf. spec itération 3) —
# distribution officielle XCFramework prébuilt, pas de build source nécessaire.
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.31.0
targets:
  GPXroad:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      # Les CLAUDE.md par-dossier (Ride/Map/Offline/Settings) sont exclus explicitement ci-
      # dessous : sans excludes, xcodegen les traite comme des ressources à copier dans le
      # bundle, et Xcode refuse de builder (4 fichiers différents nommés "CLAUDE.md" entrent
      # en collision sur le même chemin de sortie dans l'app). Si un futur CLAUDE.md est ajouté
      # dans un nouveau sous-dossier listé ici, lui ajouter le même excludes.
      - path: GPXroad/App
      - path: GPXroad/Config
      - path: GPXroad/Models
      - path: GPXroad/Services
      - path: GPXroad/Views
      - path: GPXroad/Ride
        excludes:
          - CLAUDE.md
      - path: GPXroad/Map
        excludes:
          - CLAUDE.md
      - path: GPXroad/Offline
        excludes:
          - CLAUDE.md
      - path: GPXroad/Waypoints
      - path: GPXroad/Planning
      - path: GPXroad/Recording
      - path: GPXroad/Nav
      - path: GPXroad/RoadBook
        excludes:
          - CLAUDE.md
      - path: GPXroad/Rendering
      - path: GPXroad/Settings
        excludes:
          - CLAUDE.md
      - path: GPXroad/Onboarding
      - path: GPXroad/Tutorial
      - path: GPXroad/Sync
      - path: GPXroad/Resources
        buildPhase: resources
    dependencies:
      - package: MapLibre
        product: MapLibre
      # It32 : logique partagée Kotlin Multiplatform (framework STATIQUE, rien à embarquer),
      # construite par la cible agrégée SharedKotlin (voir aggregateTargets) AVANT toute
      # compilation — pas en pré-build de cette cible : les tests compilaient alors parfois contre
      # l'ancien framework (course constatée à it32).
      - target: SharedKotlin
      - framework: ../shared/build/XCFrameworks/release/GPXroadShared.xcframework
        embed: false
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: GPXroad
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations: [fr, en, de, es, it]
        # Fix "splash-version-still-1.0" (it23bis, retour terrain : "la version affichée sur le
        # splash c'est toujours 1.0") — root cause réelle : XcodeGen insère ses PROPRES valeurs
        # par défaut ("1.0"/"1", en dur) pour CFBundleShortVersionString/CFBundleVersion quand
        # ces clés sont ABSENTES de `info.properties`, quelle que soit la valeur de
        # MARKETING_VERSION/CURRENT_PROJECT_VERSION dans `settings.base` ci-dessous — ces deux
        # réglages n'étaient donc JAMAIS lus, le "fix" de la session précédente (passer
        # MARKETING_VERSION à "0.0.22") n'avait aucun effet réel sur le binaire généré. Corrigé
        # en référençant EXPLICITEMENT les variables de build ici — c'est cette explicitation,
        # pas la valeur de MARKETING_VERSION elle-même, qui manquait.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: "GPXroad affiche votre position sur la trace et enregistre votre sortie quand vous le demandez, y compris écran verrouillé ou dans une autre app pendant l'enregistrement."
        # It30 (fix "recording-survives-tabs-and-background") : enregistrement de la sortie en
        # arrière-plan, seulement pendant un enregistrement démarré par l'utilisateur (indicateur
        # bleu d'iOS). Voir `RideRecorder`/`CoreLocationRecordingSource`.
        UIBackgroundModes:
          - location
        # It33 bis : serveur Overpass de la maison (HTTP, adresse locale) — autorisation « réseau
        # local » d'iOS, et exception ATS limitée aux adresses locales (le HTTPS reste obligatoire
        # partout ailleurs).
        NSLocalNetworkUsageDescription: "GPXroad interroge ton serveur Overpass sur le réseau de la maison pour charger les repères du Road Book plus vite."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSMicrophoneUsageDescription: "GPXroad utilise le micro pour enregistrer une courte note audio optionnelle sur un point d'intérêt."
        ITSAppUsesNonExemptEncryption: false
        LSSupportsOpeningDocumentsInPlace: true
        UISupportsDocumentBrowser: false
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.topografix.gpx
            UTTypeDescription: "Trace GPX"
            UTTypeConformsTo:
              - public.xml
            UTTypeTagSpecification:
              public.filename-extension:
                - gpx
              public.mime-type:
                - application/gpx+xml
        CFBundleDocumentTypes:
          - CFBundleTypeName: "Trace GPX"
            LSItemContentTypes:
              - com.topografix.gpx
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
    settings:
      base:
        # Renommage GPXlibre → GPXroad : Bundle ID VOLONTAIREMENT inchangé pendant la phase dev
        # (décision du propriétaire) — la même app est mise à jour sur l'iPhone, données et clé
        # Valhalla (trousseau `com.olivier.gpxlibre.valhalla`) conservées. À changer au passage
        # TestFlight : nouveau Bundle ID = nouvelle app, conteneur de données vide (voir TODO.md).
        PRODUCT_BUNDLE_IDENTIFIER: com.olivier.gpxlibre
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Convention de version explicite du propriétaire tant que l'app est en phase de test :
        # "0.0.<numéro d'itération>" (0.0.21 = itération 21, 0.0.22 = itération 22, etc.) —
        # affichée sur l'écran de démarrage (SplashScreenView), lue depuis
        # CFBundleShortVersionString, jamais recopiée en dur côté Swift.
        MARKETING_VERSION: "0.0.44"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: V9Q4V3W2RZ

  # Tests unitaires (Bloc 5) : encode/decode du payload de synchro des points bloqués
  # partagés — livré même sans instance serveur publique prouvée dans cette session.
  GPXroadTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: GPXroadTests
    dependencies:
      - target: SharedKotlin
      - target: GPXroad
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: V9Q4V3W2RZ

# It32 : build du framework Kotlin partagé (shared/), seulement si ses sources ont changé — le
# cycle iOS quotidien ne lance jamais Gradle (scripts/build_shared.sh).
aggregateTargets:
  SharedKotlin:
    buildScripts:
      - name: "Framework Kotlin partagé (si shared/ a changé)"
        script: "\"${SRCROOT}/scripts/build_shared.sh\""
        basedOnDependencyAnalysis: false
        # Sorties déclarées : sans elles, Xcode lie le framework lu AVANT le script, donc l'ancien
        # quand shared/ vient de changer (constaté à it32).
        outputFiles:
          - $(SRCROOT)/../shared/build/XCFrameworks/release/GPXroadShared.xcframework/ios-arm64/GPXroadShared.framework/GPXroadShared
          - $(SRCROOT)/../shared/build/XCFrameworks/release/GPXroadShared.xcframework/ios-arm64-simulator/GPXroadShared.framework/GPXroadShared
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
